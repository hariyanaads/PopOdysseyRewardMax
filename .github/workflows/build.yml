name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingKey.jks
          chmod 600 signingKey.jks
          keytool -list -keystore signingKey.jks \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -alias "${{ secrets.ALIAS }}"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/PopOdysseyRewardMax.apk"

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            -f -v 4 "$APK" "$ALIGNED"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks signingKey.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose "$SIGNED"

      - name: Remove signing key
        if: always()
        run: rm -f signingKey.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopOdysseyRewardMax-v${{ github.run_number }}
          path: app/build/outputs/apk/release/PopOdysseyRewardMax.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: app/build/outputs/apk/release/PopOdysseyRewardMax.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
